name: Deploy — Staging

on:
  push:
    branches: [main]
    # Si el push solo trae estos archivos no se despliega: no cambian lo que se construye y
    # cada deploy gasta 3 de los 100 deployments diarios de Vercel Hobby. Con un solo archivo
    # fuera de la lista, el deploy corre igual.
    paths-ignore:
      - 'docs/**'
      - 'Documentacion/**'
      - '**/*.md'
      - '**/*.spec.ts'
      - '**/*.spec.tsx'
      - '**/*.test.ts'
      - '**/*.test.tsx'
      - 'apps/backend/test/**'
      - '.github/workflows/ci.yml'
      - '.github/workflows/carga-k6.yml'
      - 'scripts/carga/**'
      - 'sonar-project.properties'

jobs:
  deploy-staging:
    name: Deploy to staging
    runs-on: ubuntu-latest
    outputs:
      web_admin_url: ${{ steps.vercel-admin.outputs.url }}
      web_cliente_url: ${{ steps.vercel-cliente.outputs.url }}
      web_staff_url: ${{ steps.vercel-staff.outputs.url }}
      web_auth_url: ${{ steps.vercel-auth.outputs.url }}

    steps:
      # El deploy de web-auth es el último: sin su proyecto de Vercel fallaría con el backend y las otras apps ya
      # desplegados. Corta antes.
      - name: Check web-auth Vercel project
        run: test -n "$VERCEL_PROJECT_ID_AUTH" || { echo "::error::Falta el secret VERCEL_PROJECT_ID_AUTH (Documentacion/WORKFLOW.md)"; exit 1; }
        env:
          VERCEL_PROJECT_ID_AUTH: ${{ secrets.VERCEL_PROJECT_ID_AUTH }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm turbo build --filter=@menyu/api --filter=@menyu/web-admin --filter=@menyu/web-cliente --filter=@menyu/web-staff --filter=@menyu/web-auth

      # ── Railway staging ──────────────────────────────────────
      # El SHA que muestra /health. RAILWAY_GIT_COMMIT_SHA solo llega en deploys disparados
      # desde GitHub, no con `railway up`. --skip-deploys: el deploy lo hace el paso siguiente.
      - name: Set APP_COMMIT_SHA on Railway staging
        run: npx @railway/cli@5.70.0 variable set "APP_COMMIT_SHA=$GIT_SHA" --service ${{ secrets.RAILWAY_SERVICE_ID_STAGING }} --skip-deploys
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}
          GIT_SHA: ${{ github.sha }}

      - name: Deploy backend to Railway staging
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: npx @railway/cli@5.70.0 up --service ${{ secrets.RAILWAY_SERVICE_ID_STAGING }} --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN_STAGING }}

      # ── Vercel staging (preview, sin --prod) ─────────────────
      - name: Deploy web-admin to Vercel staging
        id: vercel-admin
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            npx vercel@54.6.1 pull --yes --environment=preview --token ${{ secrets.VERCEL_TOKEN }}
            npx vercel@54.6.1 build --token ${{ secrets.VERCEL_TOKEN }}
            url=$(npx vercel@54.6.1 deploy --prebuilt --token ${{ secrets.VERCEL_TOKEN }}) && echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}

      - name: Deploy web-cliente to Vercel staging
        id: vercel-cliente
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            npx vercel@54.6.1 pull --yes --environment=preview --token ${{ secrets.VERCEL_TOKEN }}
            npx vercel@54.6.1 build --token ${{ secrets.VERCEL_TOKEN }}
            url=$(npx vercel@54.6.1 deploy --prebuilt --token ${{ secrets.VERCEL_TOKEN }}) && echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CLIENTE }}

      - name: Deploy web-staff to Vercel staging
        id: vercel-staff
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            npx vercel@54.6.1 pull --yes --environment=preview --token ${{ secrets.VERCEL_TOKEN }}
            npx vercel@54.6.1 build --token ${{ secrets.VERCEL_TOKEN }}
            url=$(npx vercel@54.6.1 deploy --prebuilt --token ${{ secrets.VERCEL_TOKEN }}) && echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_STAFF }}

      - name: Deploy web-auth to Vercel staging
        id: vercel-auth
        uses: nick-fields/retry@v3
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            npx vercel@54.6.1 pull --yes --environment=preview --token ${{ secrets.VERCEL_TOKEN }}
            npx vercel@54.6.1 build --token ${{ secrets.VERCEL_TOKEN }}
            url=$(npx vercel@54.6.1 deploy --prebuilt --token ${{ secrets.VERCEL_TOKEN }}) && echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_AUTH }}

  # ── Smoke post-deploy (solo lectura) ─────────────────────────
  smoke-staging:
    name: Smoke de staging
    needs: deploy-staging
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # La URL del backend es la VITE_API_URL de preview de web-cliente en Vercel: se lee solo esa
      # línea, el archivo no se imprime ni se sube y se borra al terminar el paso.
      - name: Resolve staging API URL
        run: |
          dir="$RUNNER_TEMP/vercel-cliente"
          trap 'rm -rf "$dir"' EXIT
          mkdir -p "$dir"
          npx vercel@54.6.1 pull --yes --environment=preview --cwd "$dir" --token ${{ secrets.VERCEL_TOKEN }}
          node scripts/smoke/leer-api-url.mjs "$dir/.vercel/.env.preview.local"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_CLIENTE }}

      - name: Wait for /health to show this commit
        run: node scripts/smoke/esperar-sha.mjs
        env:
          EXPECTED_SHA: ${{ github.sha }}

      - name: Smoke
        run: node scripts/smoke/smoke.mjs
        env:
          WEB_ADMIN_URL: ${{ needs.deploy-staging.outputs.web_admin_url }}
          WEB_CLIENTE_URL: ${{ needs.deploy-staging.outputs.web_cliente_url }}
          WEB_STAFF_URL: ${{ needs.deploy-staging.outputs.web_staff_url }}
          WEB_AUTH_URL: ${{ needs.deploy-staging.outputs.web_auth_url }}
