# Identificación del proyecto en SonarCloud (organización y proyecto creados al importar MenYUorg/MenYU)
sonar.organization=menyuorg
sonar.projectKey=MenYUorg_MenYU
sonar.projectName=MenYU
sonar.sourceEncoding=UTF-8

# Código fuente a analizar: el src/ de las 4 apps del monorepo y el de packages/ui (componentes compartidos)
sonar.sources=apps/backend/src,apps/web-admin/src,apps/web-cliente/src,apps/web-staff/src,packages/ui/src

# Carpetas donde viven los tests: los .spec/.test conviven junto al código dentro de src/ de cada app
sonar.tests=apps/backend/src,apps/web-admin/src,apps/web-cliente/src,apps/web-staff/src,packages/ui/src

# Patrones que identifican archivos de test dentro de sonar.tests (incluye los helpers y fixtures de src/test/ de los frontends)
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts,**/src/test/**

# Exclusiones globales: los mismos patrones de test (para que no cuenten como código fuente) más artefactos generados o no analizables
sonar.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts,**/src/test/**,**/*.d.ts,**/node_modules/**,**/dist/**,**/coverage/**

# Archivos que se analizan por bugs y code smells pero no cuentan para el cálculo de cobertura (mismo criterio que collectCoverageFrom de jest y coverage.exclude de vitest)
sonar.coverage.exclusions=**/*.module.ts,**/main.ts,**/main.tsx,**/*.dto.ts

# Reportes de cobertura lcov que genera el paso "Coverage" del CI, relativos a la raíz del monorepo
sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/web-admin/coverage/lcov.info,apps/web-cliente/coverage/lcov.info,apps/web-staff/coverage/lcov.info,packages/ui/coverage/lcov.info

# El token se lee de la variable de entorno SONAR_TOKEN (secreto del repo) — nunca se hardcodea acá
