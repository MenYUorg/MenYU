# Identificación del proyecto en SonarQube
sonar.projectKey=menyu
sonar.projectName=MenYU
sonar.host.url=http://localhost:9000
sonar.sourceEncoding=UTF-8

# Carpetas de código fuente a analizar: las 4 apps del monorepo más los 3 packages/ que tienen código propio (packages/config son solo tsconfigs y no entra)
sonar.sources=apps/backend/src,apps/web-admin/src,apps/web-cliente/src,apps/web-staff/src,packages/auth/src,packages/types/src,packages/ui/src

# Carpetas donde viven los tests: los .spec.ts/.e2e-spec.ts conviven junto al código dentro de src/ de cada app
sonar.tests=apps/backend/src,apps/web-admin/src,apps/web-cliente/src,apps/web-staff/src

# Patrones que identifican archivos de test dentro de sonar.tests
sonar.test.inclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts

# Exclusiones globales: los mismos patrones de test (para que no cuenten como código fuente) más artefactos generados o no analizables
sonar.exclusions=**/*.spec.ts,**/*.spec.tsx,**/*.test.ts,**/*.test.tsx,**/*.e2e-spec.ts,**/*.d.ts,**/node_modules/**,**/dist/**,**/coverage/**

# Archivos que se analizan por bugs y code smells pero no cuentan para el cálculo de cobertura (mismo criterio que collectCoverageFrom en jest.config.js)
sonar.coverage.exclusions=**/*.module.ts,**/main.ts,**/main.tsx,**/*.dto.ts

# Reportes de cobertura lcov de cada app, relativos a la raíz del monorepo
sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/web-admin/coverage/lcov.info,apps/web-cliente/coverage/lcov.info,apps/web-staff/coverage/lcov.info

# El token se lee de la variable de entorno SONAR_TOKEN — nunca se hardcodea acá
