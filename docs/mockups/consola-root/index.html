<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mockups de la consola de ROOT</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --orange: #E8563A; --orange-soft: #FDE5DF; --navy: #2D3561; --bg: #F7F7F8;
      --text: #1A1A2E; --text-sub: #6B7280; --border: #E5E7EB; --white: #FFFFFF;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body { margin: 0; background: var(--bg); color: var(--text); font: 400 14px/1.5 Inter, sans-serif; display: flex; flex-direction: column; }
    h1, h2, h3, p { margin: 0; }

    .top { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; padding: 10px 16px; background: var(--navy); color: #fff; }
    .top strong { font: 800 16px Montserrat, sans-serif; letter-spacing: -0.01em; }
    .top .fase { font: 600 11px Montserrat, sans-serif; background: var(--orange); border-radius: 999px; padding: 3px 10px; }
    .top .espacio { flex: 1; }
    .anchos { display: flex; gap: 6px; flex-wrap: wrap; }
    .anchos button, .top a.abrir {
      font: 600 12px Montserrat, sans-serif; color: #fff; background: rgba(255,255,255,.1);
      border: 1.5px solid rgba(255,255,255,.25); border-radius: 8px; padding: 6px 12px; cursor: pointer; text-decoration: none;
    }
    .anchos button[aria-pressed="true"] { background: #fff; color: var(--navy); border-color: #fff; }

    .cuerpo { flex: 1; min-height: 0; display: grid; grid-template-columns: 290px minmax(0, 1fr); }
    .lista { overflow-y: auto; background: var(--white); border-right: 1px solid var(--border); padding: 10px 8px 24px; }
    .lista h2 { font: 800 11px Montserrat, sans-serif; letter-spacing: .1em; text-transform: uppercase; color: var(--navy); padding: 14px 10px 6px; }
    .lista button {
      display: block; width: 100%; text-align: left; background: none; border: none; border-radius: 8px;
      padding: 7px 10px; font: 400 13px Inter, sans-serif; color: var(--text); cursor: pointer;
    }
    .lista button:hover { background: var(--bg); }
    .lista button[aria-current="true"] { background: var(--orange-soft); color: var(--orange); font-weight: 600; }
    .lista .etiqueta { font: 600 10px Montserrat, sans-serif; color: var(--orange); background: var(--orange-soft); border-radius: 999px; padding: 1px 7px; margin-left: 6px; }
    .lista button[aria-current="true"] .etiqueta { background: #fff; }

    .vista { overflow: auto; padding: 16px 20px 40px; min-width: 0; }
    .encabezado { max-width: 880px; margin-bottom: 14px; }
    .encabezado h1 { font: 800 20px Montserrat, sans-serif; color: var(--navy); letter-spacing: -0.01em; margin-bottom: 4px; }
    .encabezado p { color: var(--text-sub); }
    .encabezado p b { color: var(--text); font-weight: 600; }

    .lienzo { display: flex; gap: 24px; align-items: flex-start; flex-wrap: nowrap; }
    .marco { flex: none; }
    .marco figcaption { font: 600 11px Montserrat, sans-serif; color: var(--text-sub); letter-spacing: .06em; margin-bottom: 6px; }
    .marco iframe { display: block; border: 1px solid #c9ccd6; border-radius: 6px; background: #fff; box-shadow: 0 6px 24px rgba(45,53,97,.12); }

    .texto { max-width: 880px; background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 18px 22px 8px; }
    .texto h2 { font: 800 15px Montserrat, sans-serif; color: var(--navy); margin: 0 0 8px; }
    .texto ol, .texto ul { margin: 0 0 12px; padding-left: 20px; }
    .texto li { margin-bottom: 10px; }
    .texto li b { font-weight: 600; }
    .texto a { color: var(--orange); font-weight: 600; cursor: pointer; text-decoration: none; }
    .texto a:hover { text-decoration: underline; }
    .texto .nota-chica { color: var(--text-sub); font-size: 13px; margin-bottom: 12px; }
    .pregunta { display: inline-block; font: 700 10px Montserrat, sans-serif; letter-spacing: .06em; color: #92400e; background: #fef3c7; border-radius: 999px; padding: 1px 8px; margin-right: 6px; vertical-align: 1px; }

    @media (max-width: 900px) {
      .cuerpo { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
      .lista { max-height: 210px; border-right: none; border-bottom: 1px solid var(--border); }
    }
  </style>
</head>
<body>
  <header class="top">
    <strong>Mockups · Consola de ROOT</strong>
    <span class="fase">Aprobado el 2026-10-15</span>
    <span class="fase">Novedades para aprobar</span>
    <span class="espacio"></span>
    <div class="anchos" id="anchos" role="group" aria-label="Ancho de pantalla">
      <button type="button" data-ancho="320">320</button>
      <button type="button" data-ancho="360">Celular 360</button>
      <button type="button" data-ancho="390">390</button>
      <button type="button" data-ancho="768">Tablet 768</button>
      <button type="button" data-ancho="1280">Escritorio 1280</button>
      <button type="button" data-ancho="todos">Los tres</button>
    </div>
    <a class="abrir" id="abrir" href="#" target="_blank" rel="noopener">Abrir sola ↗</a>
  </header>

  <div class="cuerpo">
    <nav class="lista" id="lista" aria-label="Pantallas"></nav>
    <main class="vista">
      <div class="encabezado"><h1 id="titulo"></h1><p id="nota"></p></div>
      <div id="contenido"></div>
    </main>
  </div>

        ] },
        { nombre: 'Diálogos · cuentas ROOT (novedad)', items: [
          { id: 'd-nuevo-root', titulo: 'Nueva cuenta ROOT', src: P + '?vista=roots&dialogo=nuevo-root', nota: 'Email y contraseña inicial generada, igual que un dueño. La persona la cambia en su primer ingreso.' },
          { id: 'd-nuevo-root-email', titulo: 'Email repetido', src: P + '?vista=roots&dialogo=nuevo-root&error=email', nota: 'Ya existe una cuenta con ese email.' },
          { id: 'd-root-creado', titulo: 'Cuenta ROOT creada', src: P + '?vista=roots&dialogo=root-creado', nota: 'La contraseña se muestra una sola vez. Dice que la acción quedó registrada en el historial.' },
          { id: 'd-restablecer-root', titulo: 'Restablecer contraseña de un ROOT', src: P + '?vista=roots&dialogo=restablecer-root&dato=ro2', nota: 'Cierra las sesiones de esa cuenta y la obliga a cambiarla al entrar. Los diálogos que cambian algo avisan <b>"Esta acción queda registrada en el historial"</b>.' },
          { id: 'd-restablecido-root', titulo: 'Contraseña nueva generada', src: P + '?vista=roots&dialogo=restablecido-root&dato=ro2', nota: 'Se muestra una vez.' },
          { id: 'd-cambiar-password', titulo: 'Cambiar mi contraseña', src: P + '?vista=roots&dialogo=cambiar-password', nota: 'La contraseña actual y la nueva dos veces. Cierra las demás sesiones de la propia cuenta.' },
          { id: 'd-baja-aviso', titulo: 'Aviso del historial en otro diálogo', src: P + '?vista=marca&id=m3&dialogo=baja-marca', nota: 'Ahora todos los diálogos que cambian algo (marcas, restaurantes, dueños y cuentas ROOT) llevan el aviso del historial, arriba de los botones.' },
        ] },
      ]

      var DECISIONES = '<h2>Aprobado el 2026-10-15</h2>' +
        '<p class="nota-chica">Los mockups originales y los nueve supuestos del plan, <b>incluidos el 6 (la baja corta de verdad) y el 8 (contraseña generada con cambio obligatorio en el primer ingreso)</b>. La etapa 4, sacarle a ROOT los permisos viejos, va al final.</p>' +
        '<h2>Se agregó el mismo día, a pedido del equipo</h2><ol start="13">' +
        '<li><b>Un ROOT crea otras cuentas ROOT</b> desde la consola (una por integrante: tres). <a data-ir="roots">Cuentas ROOT</a>.</li>' +
        '<li><b>El primer ROOT se crea con un script</b> que corre el equipo, con la contraseña elegida al correrlo (sin eco; no queda escrita en el repo). Ya está hecho: <code>apps/backend/scripts/cuentas-root.ts</code>.</li>' +
        '<li><b>Las cuentas ROOT no se pueden borrar:</b> ni a sí mismo ni el último. Se ve en <a data-ir="roots">Cuentas ROOT</a>: no hay "Eliminar".</li>' +
        '<li><b><code>root@menyu.com</code> se retira</b> de staging y de producción cuando las cuentas personales anden bien (etapa 5 del plan). Se ve en <a data-ir="historial-detalle">el historial</a>, como acción del script.</li>' +
        '<li><b>Historial de acciones de ROOT:</b> quién, qué, sobre qué y cuándo, incluidos crear un ROOT y restablecer contraseñas. No se puede editar ni borrar (ni la app, ni la API, ni la base), y todos los ROOT lo ven. <a data-ir="historial">Historial</a>.</li></ol>' +
        '<h2>Para confirmar (suposiciones mías sobre eso)</h2><ol start="15">' +
        '<li><b>15 · Cómo leí "las cuentas root no se pueden borrar":</b> ninguna cuenta ROOT se borra desde la consola ni desde la API; la única vía es el script, que nunca borra al último, y la base de datos también lo impide. Si querías que un ROOT pueda borrar a otro (menos a sí mismo y al último), es un cambio chico.</li>' +
        '<li><b>18 · Qué se registra:</b> todo cambio que haga un ROOT (crear, editar, dar de baja, reactivar, restablecer, eliminar un dueño). Mirar listas no. Cada registro se guarda en la <b>misma transacción</b> que el cambio (si no se puede registrar, el cambio no se hace), con el email de quien lo hizo copiado (para que siga ahí aunque esa cuenta se retire) y sin contraseñas. <b>Opcional:</b> registrar también los inicios de sesión de ROOT.</li>' +
        '<li><b>19 · Un ROOT puede restablecer la contraseña de otro ROOT</b> (queda registrado; la otra persona la cambia al entrar). Lo necesitan si alguien la olvida.</li>' +
        '<li><b>20 · Mínimo de 12 caracteres</b> al elegir la contraseña en el primer ingreso, para dueños y ROOT (hoy los dueños tienen 8 como mínimo al crear la cuenta). <a data-ir="primer-ingreso">Se ve acá</a>.</li></ol>' +
        '<h2>Lo que ROOT hace y lo que no</h2><ul>' +
        '<li><b>Crea, edita y da de baja</b> marcas y restaurantes; <b>crea, edita y elimina</b> cuentas de dueño; <b>crea</b> otras cuentas ROOT. <a data-ir="marca">Detalle de una marca</a>.</li>' +
        '<li><b>Los gerentes no los crea ROOT:</b> los crea el dueño desde su panel.</li>' +
        '<li><b>ROOT no ve ni decide</b> sobre menú, precios, descuentos, mesas, mozos, pedidos, reportes ni caja, y <b>no cambia el logo ni la dirección</b>.</li></ul>' +
        '<h2>Colores y letras</h2><p class="nota-chica">Los de <b>web-admin</b> (<code>AdminLayout.tsx</code> y <code>pages/admin/marca/estilos.ts</code>): azul <b>#2D3561</b>, naranja <b>#E8563A</b>, bordes <b>#e5e7eb</b>, fondo <b>#f9fafb</b>, rojo <b>#dc2626</b> y verde <b>#16a34a</b>. Montserrat e Inter. Botones y áreas táctiles de al menos 44 px y campos de 16 px. Detalle técnico, etapas y estimación: <b>docs/plan-consola-root.md</b>.</p>'

      var DISPOSITIVOS = {
        320: { alto: 640, nombre: 'Celular chico' },
        360: { alto: 740, nombre: 'Celular' },
        390: { alto: 844, nombre: 'Celular' },
        768: { alto: 900, nombre: 'Tablet' },
        1280: { alto: 800, nombre: 'Escritorio' },
      };

      var lista = document.getElementById('lista');
      var contenido = document.getElementById('contenido');
      var tituloEl = document.getElementById('titulo');
      var notaEl = document.getElementById('nota');
      var abrir = document.getElementById('abrir');
      var botonesAncho = Array.prototype.slice.call(document.querySelectorAll('#anchos button'));

      var todos = [{ id: 'decidir', titulo: 'Qué se aprobó y qué confirmar', texto: true }];
      GRUPOS.forEach(function (g) { g.items.forEach(function (i) { todos.push(i); }); });

      var actual = 'decidir';
      var ancho = '390';

      function pintarLista() {
        var html = '<h2>Antes de empezar</h2><button type="button" data-id="decidir">Qué se aprobó y qué confirmar<span class="etiqueta">4</span></button>';
        GRUPOS.forEach(function (g) {
          html += '<h2>' + g.nombre + '</h2>';
          g.items.forEach(function (i) { html += '<button type="button" data-id="' + i.id + '">' + i.titulo + '</button>'; });
        });
        lista.innerHTML = html;
      }

      function marco(anchoPx, src, zoom) {
        var d = DISPOSITIVOS[anchoPx];
        var pct = zoom && zoom < 0.995 ? ' · al ' + Math.round(zoom * 100) + '%' : '';
        return '<figure class="marco" style="margin:0' + (zoom && zoom < 0.995 ? ';zoom:' + zoom : '') + '"><figcaption>' + d.nombre.toUpperCase() + ' · ' + anchoPx + ' × ' + d.alto + pct + '</figcaption>' +
          '<iframe title="' + d.nombre + ' ' + anchoPx + '" src="' + src + '" style="width:' + anchoPx + 'px;height:' + d.alto + 'px"></iframe></figure>';
      }

      function pintar() {
        var item = todos.filter(function (i) { return i.id === actual; })[0] || todos[0];
        Array.prototype.forEach.call(lista.querySelectorAll('button'), function (b) {
          if (b.dataset.id === item.id) { b.setAttribute('aria-current', 'true'); } else { b.removeAttribute('aria-current'); }
        });
        botonesAncho.forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.ancho === ancho)); });

        tituloEl.textContent = item.titulo;
        if (item.texto) {
          notaEl.textContent = '';
          contenido.innerHTML = '<div class="texto">' + DECISIONES + '</div>';
          abrir.style.display = 'none';
          return;
        }
        abrir.style.display = '';
        abrir.href = item.src;
        notaEl.innerHTML = item.nota;

        if (ancho === 'todos') {
          var disponible = contenido.parentElement.clientWidth - 40 - 48;
          var zoom = Math.min(1, disponible / (360 + 768 + 1280));
          contenido.innerHTML = '<div class="lienzo">' + marco(360, item.src, zoom) + marco(768, item.src, zoom) + marco(1280, item.src, zoom) + '</div>';
        } else {
          var libre = contenido.parentElement.clientWidth - 40;
          contenido.innerHTML = '<div class="lienzo">' + marco(Number(ancho), item.src, Math.min(1, libre / Number(ancho))) + '</div>';
        }
      }

      function ir(id, nuevoAncho) {
        actual = id;
        if (nuevoAncho) ancho = nuevoAncho;
        history.replaceState(null, '', '#' + actual + ':' + ancho);
        pintar();
      }

      lista.addEventListener('click', function (e) {
        var b = e.target.closest('button[data-id]');
        if (b) ir(b.dataset.id);
      });
      function irDesdeEnlace(e) {
        var a = e.target.closest('a[data-ir]');
        if (!a) return;
        e.preventDefault();
        var destino = a.dataset.ir;
        ir(destino === 'marca' ? 'marca' : destino);
      }
      contenido.addEventListener('click', irDesdeEnlace);
      notaEl.addEventListener('click', irDesdeEnlace);
      botonesAncho.forEach(function (b) { b.addEventListener('click', function () { ir(actual, b.dataset.ancho); }); });
      var pendiente = null;
      window.addEventListener('resize', function () { clearTimeout(pendiente); pendiente = setTimeout(pintar, 120); });
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
        if (e.target.closest && e.target.closest('iframe, input')) return;
        var pos = todos.findIndex(function (i) { return i.id === actual; });
        var sig = todos[pos + (e.key === 'ArrowDown' ? 1 : -1)];
        if (sig) { e.preventDefault(); ir(sig.id); }
      });

      var hash = location.hash.replace('#', '').split(':');
      if (hash[0] && todos.some(function (i) { return i.id === hash[0]; })) actual = hash[0];
      if (hash[1] && (hash[1] === 'todos' || DISPOSITIVOS[hash[1]])) ancho = hash[1];

      pintarLista();
      pintar();
    })();
  </script>
</body>
</html>
